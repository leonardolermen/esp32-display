<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudinho</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header><h1>Claudinho</h1><span id="clock"></span></header>
<main>
  <section id="pin" class="card">
    <h2>PIN de administrador</h2>
    <p class="hint">Como o do celular: de 4 a 6 números. Protege as fotos e as configurações.</p>
    <form id="pin-form">
      <input type="password" id="pin-value" placeholder="PIN" inputmode="numeric" pattern="[0-9]*" maxlength="6"
        autocomplete="off">
      <input type="password" id="pin-confirm" placeholder="confirme o PIN" inputmode="numeric" pattern="[0-9]*"
        maxlength="6" autocomplete="off">
      <p class="error" id="pin-error"></p>
      <button type="submit">Salvar PIN</button>
    </form>
  </section>
  <section id="photos" class="card hidden">
    <h2>Fotos</h2>
    <p class="hint">O navegador recorta para a tela (480×320) antes de enviar.</p>
    <div id="photo-grid"></div>
    <label class="button">Enviar fotos<input type="file" id="photo-input" accept="image/*" multiple hidden></label>
    <p id="photo-progress"></p>
  </section>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
