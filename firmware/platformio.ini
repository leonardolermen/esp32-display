[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -I src
; Pastas presas a hardware ou framework não compilam no PC; veja CLAUDE.md.
build_src_filter =
    +<*>
    -<main.cpp>
    -<theme/>
    -<*/device/>
    -<*/screen/>
    -<*/web/>
    -<*/storage/>
lib_deps =
    bblanchon/ArduinoJson@7.4.2
