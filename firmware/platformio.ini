[platformio]
default_envs = board

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -I src
; Pastas presas a hardware ou framework não compilam no PC; veja CLAUDE.md.
build_src_filter =
    +<*>
    -<main.cpp>
    -<theme/>
    -<*/device/>
    -<*/screen/>
    -<*/web/>
    -<*/storage/>
lib_deps =
    bblanchon/ArduinoJson@7.4.2

[env:board]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; A página web vai dentro do firmware: uploadfs apagaria as fotos (veja CLAUDE.md).
board_build.embed_files =
    web/index.html
    web/app.css
    web/app.js
    web/crop.js
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -D ASYNCWEBSERVER_REGEX
    -D CLAUDINHO_PROFILE_FLUSH
    ; O Arduino_GFX manda o quadro em blocos de 1024 pixels e espera cada um: 150 transações por quadro. Com
    ; 8192 são 19, e o envio para de pagar a preparação de cada transação.
    -D ESP32QSPI_MAX_PIXELS_AT_ONCE=8192
    -I include
lib_deps =
    lvgl/lvgl@9.4.0
    moononournation/GFX Library for Arduino@1.6.9
    bblanchon/ArduinoJson@7.4.2
    tzapu/WiFiManager@2.0.17
    ESP32Async/ESPAsyncWebServer@3.7.10
    ESP32Async/AsyncTCP@3.4.5
    bitbank2/JPEGDEC@1.8.2
